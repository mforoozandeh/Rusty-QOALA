[package]
name = "qoala-gui"
version = "1.1.0"
edition = "2021"
# eframe and its graphics stack move faster than the library does; the GUI
# carries its own, higher, minimum.
rust-version = "1.85"
description = "Browser and desktop front end for the QOALA pulse optimiser"
license = "MIT"
authors = ["Mohammadali Foroozandeh"]
repository = "https://github.com/mforoozandeh/Rusty-QOALA"
publish = false
# Two binaries, but only one is ever run by hand: the worker is loaded by the
# browser, not started from a shell.
default-run = "qoala-gui"

[lib]
name = "qoala_gui"
path = "src/lib.rs"

[[bin]]
name = "qoala-gui"
path = "src/bin/app.rs"

# The browser build runs the optimisation in this, as a Web Worker.  It does
# nothing natively; it is built for wasm32 by Trunk.
[[bin]]
name = "qoala-worker"
path = "src/bin/worker.rs"

[dependencies]
qoala = { path = ".." }
eframe = { version = "0.32", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui_plot = "0.33"
nalgebra = "0.33"
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
rfd = "0.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "Blob",
    "DedicatedWorkerGlobalScope",
    "BlobPropertyBag",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlElement",
    "Location",
    "MessageEvent",
    "Storage",
    "Url",
    "Window",
    "Worker",
    "WorkerGlobalScope",
]
