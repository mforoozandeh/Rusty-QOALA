[package]
name = "qoala"
version = "1.3.0"
edition = "2021"
rust-version = "1.87"
description = "Quantum Optimal control by Adaptive Low-cost Algorithm: GRAPE pulse optimisation for coupled two-level systems, with adaptive operator splitting"
license = "MIT"
authors = ["Mohammadali Foroozandeh"]
readme = "README.md"
repository = "https://github.com/mforoozandeh/Rusty-QOALA"
documentation = "https://docs.rs/qoala"
keywords = ["optimal-control", "grape", "quantum", "nmr", "spin-dynamics"]
categories = ["science", "mathematics", "simulation"]
exclude = ["/.github", "/deploy", "/dev-doc", "/gui", "*.csv"]

# The GUI is a workspace member but not a default one: `cargo build`,
# `cargo test` and `cargo clippy` at the root still act on the published crate
# alone, so the library's MSRV is not held hostage to a UI toolkit's.  Build it
# with `cargo run -p qoala-gui`.
[workspace]
members = ["gui"]
default-members = ["."]

[dependencies]
nalgebra = "0.33"
nalgebra-sparse = "0.10"
num-complex = "0.4"
rand = "0.8"
rand_chacha = "0.3"
# ESCALADE's optimiser.  Default features are off: they pull in `rand` 0.9 and
# `getrandom` 0.3, which needs its own wasm configuration, and nothing here
# uses argmin's stochastic solvers.
argmin = { version = "0.11", default-features = false }
argmin-math = { version = "0.5", default-features = false, features = ["nalgebra_v0_33"] }

[features]
default = ["parallel"]
# Spread ESCALADE's spins and fields over rayon's thread pool.  It has no
# effect on wasm32, which has no threads and does not get rayon at all.
parallel = ["dep:rayon"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { version = "1.10", optional = true }

# wasm32 has no monotonic clock and no OS entropy source of its own: the time
# shim in `src/time.rs` needs `web-time`, and `rand`'s `from_entropy` needs
# `getrandom`'s JS backend.  rand 0.8 pins getrandom 0.2, so this is the right
# major version.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
web-time = "1"

[dev-dependencies]
approx = "0.5"

# Times the objective and a whole optimisation on one thread and on many, so
# it needs rayon to set the thread count.
[[example]]
name = "escalade_parallel"
required-features = ["parallel"]

[profile.release]
opt-level = 3
lto = "thin"
